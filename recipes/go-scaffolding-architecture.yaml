name: go-scaffolding-architecture
version: 1.0.0
author: "Jules"
description: "A recipe to generate the go-scaffolding architecture."

directories:
  - cmd
  - internal/generator
  - internal/parser
  - internal/template
  - recipes

files:
  - path: cmd/main.go
    content: |
      package main

      import (
	"flag"
	"fmt"
	"os"

	"{{.Name}}/internal/generator"
	"{{.Name}}/internal/parser"
      )

      func main() {
	recipePath := flag.String("recipe", "recipes/default.yaml", "Path to the recipe file")
	outputDir := flag.String("output", "output", "Path to the output directory")
	flag.Parse()

	recipe, err := parser.Parse(*recipePath)
	if err != nil {
		fmt.Printf("Error parsing recipe file: %v\n", err)
		os.Exit(1)
	}

	if err := generator.Generate(recipe, *outputDir); err != nil {
		fmt.Printf("Error generating project: %v\n", err)
		os.Exit(1)
	}

	fmt.Printf("Project generated successfully in %s\n", *outputDir)
      }

  - path: internal/parser/parser.go
    content: |
      package parser

      import (
	"os"
	"gopkg.in/yaml.v3"
      )

      type Recipe struct {
	Name        string   `yaml:"name"`
	Version     string   `yaml:"version"`
	Author      string   `yaml:"author"`
	Description string   `yaml:"description"`
	Directories []string `yaml:"directories"`
	Files       []File   `yaml:"files"`
      }

      type File struct {
	Path    string `yaml:"path"`
	Content string `yaml:"content"`
      }

      func Parse(path string) (*Recipe, error) {
	data, err := os.ReadFile(path)
	if err != nil {
		return nil, err
	}

	var recipe Recipe
	err = yaml.Unmarshal(data, &recipe)
	if err != nil {
		return nil, err
	}

	return &recipe, nil
      }

  - path: internal/template/template.go
    content: |
      package template

      import (
	"bytes"
	"text/template"
	"{{.Name}}/internal/parser"
      )

      func Process(t string, data interface{}) (string, error) {
	tmpl, err := template.New("").Parse(t)
	if err != nil {
		return "", err
	}

	var buf bytes.Buffer
	err = tmpl.Execute(&buf, data)
	if err != nil {
		return "", err
	}

	return buf.String(), nil
      }

      func ProcessRecipe(recipe *parser.Recipe) (*parser.Recipe, error) {
	for i, file := range recipe.Files {
		processedContent, err := Process(file.Content, recipe)
		if err != nil {
			return nil, err
		}
		recipe.Files[i].Content = processedContent
	}

	return recipe, nil
      }

  - path: internal/generator/generator.go
    content: |
      package generator

      import (
	"fmt"
	"os"
	"path/filepath"

	"{{.Name}}/internal/parser"
	"{{.Name}}/internal/template"
      )

      func Generate(recipe *parser.Recipe, outputDir string) error {
	// Create the output directory if it doesn't exist
	if err := os.MkdirAll(outputDir, 0755); err != nil {
		return fmt.Errorf("failed to create output directory: %w", err)
	}

	// Create directories
	for _, dir := range recipe.Directories {
		dirPath := filepath.Join(outputDir, dir)
		if err := os.MkdirAll(dirPath, 0755); err != nil {
			return fmt.Errorf("failed to create directory %s: %w", dirPath, err)
		}
	}

	// Process and create files
	processedRecipe, err := template.ProcessRecipe(recipe)
	if err != nil {
		return fmt.Errorf("failed to process recipe templates: %w", err)
	}

	for _, file := range processedRecipe.Files {
		filePath := filepath.Join(outputDir, file.Path)
		fileDir := filepath.Dir(filePath)

		// Create parent directory if it doesn't exist
		if err := os.MkdirAll(fileDir, 0755); err != nil {
			return fmt.Errorf("failed to create directory for file %s: %w", filePath, err)
		}

		if err := os.WriteFile(filePath, []byte(file.Content), 0644); err != nil {
			return fmt.Errorf("failed to write file %s: %w", filePath, err)
		}
	}

	return nil
      }

  - path: recipes/default.yaml
    content: |
      name: my-new-project
      version: 1.0.0
      author: "Your Name"
      description: A new project generated by {{.Name}}

      directories:
        - cmd
        - internal

      files:
        - path: cmd/main.go
          content: |
            package main

            import "fmt"

            func main() {
              fmt.Println("Hello, World!")
            }

  - path: .gitignore
    content: |
      # Binaries for programs and plugins
      *.exe
      *.exe~
      *.dll
      *.so
      *.dylib

      # Test binary, built with `go test -c`
      *.test

      # Output of the go coverage tool, specifically when used with LiteIDE
      *.out

      # IDE settings and folders
      .idea/
      .vscode/

      # Output directory
      output/

  - path: go.mod
    content: |
      module {{.Name}}

      go 1.22.1

      require gopkg.in/yaml.v3 v3.0.1

  - path: README.md
    content: |
      # {{.Name}}

      {{.Description}}
