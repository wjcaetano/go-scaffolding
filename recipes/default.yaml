name: go-standard-project
version: 1.0.0
author: John Doe
description: A standard Go project structure

directories:
  - cmd
  - internal
  - pkg
  - test

files:
  - path: cmd/main.go
    content: |
      package main

      import "fmt"

      // Generated by {{.Author}} for {{.Name}}

      func main() {
        fmt.Println("Hello, World!")
      }
  - path: .gitignore
    content: |
      # Binaries for programs and plugins
      *.exe
      *.exe~
      *.dll
      *.so
      *.dylib

      # Test binary, built with `go test -c`
      *.test

      # Output of the go coverage tool, specifically when used with LiteIDE
      *.out

      # IDE settings and folders
      .idea/
      .vscode/
